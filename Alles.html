@keyframes fold67Strip {

  40%  { transform: translateY(calc(var(--d) * 80px))  skewY(calc(var(--d) * 1.6deg)); }
  60%  { transform: translateY(calc(var(--d) * -40px)) skewY(calc(var(--d) * -0.8deg)); }
  80%  { transform: translateY(calc(var(--d) * 20px))   skewY(calc(var(--d) * 0.4deg)); }
  100% { transform: translateY(0) skewY(0deg); }
}

  <script type="module">

     //---------------------------------------------------------------------
    //Supabase Verbindung (nicht ändern!!)
    //----------------------------------------------------------------------
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://kmhwwdsuzphkpfupkynf.supabase.co";
    const supabaseKey = "sb_publishable_7ih4VSPUkXVfHkBa7lrDCA_mO_d0pW1";

    const supabase = createClient(supabaseUrl, supabaseKey);
      //falls die Seite per Browser-Zurück aus dem Cache erscheint: 
    window.addEventListener("pageshow", async () =>{
        const {data: {session}} = await supabase.auth.getSession();
        if(!session)
        {
            window.location.replace("index.html");
        }
    });

    document.getElementById("logout_button").addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.replace("index.html");
    });

    document.getElementById("profil_button").addEventListener("click", () => {
        window.location.replace("profil.html");
    });

     let currentUserId = null;
    //----------------------------------------------------------------------
    //Gruppe1: Eingabe
    //----------------------------------------------------------------------
    let countdownInterval = null;
    let spielLadeId = 0;


    function starteBegruessungAnim() {
        const name = document.getElementById("name").value.trim() || "Tipper";
        const text = `Hallo ${name}! Bereit zum Tippen?`;
        const element = document.getElementById("begruessung_text");
        element.innerText = "";
        let i = 0;

        function type() {
            if (i < text.length) {
                element.textContent += text.charAt(i);
                i++;
                setTimeout(type, 65);
            }
        }
        type();
    }


    async function spielLaden() {

        let meineLadeId = ++spielLadeId;

        const id = document.getElementById("spiel_select").value;
        //const name = document.getElementById("name").value.trim();

        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }

        document.getElementById("overlay").style.display = "none";
        document.getElementById("tippSpeichern").disabled = false;
        document.getElementById("tore_a").disabled = false;
        document.getElementById("tore_b").disabled = false;
        document.getElementById("tore_a").value = "";
        document.getElementById("tore_b").value = "";
        document.getElementById("tore_a").placeholder = "-";
        document.getElementById("tore_b").placeholder = "-";

        if (!id) {
            document.getElementById("spiel_datum").innerText = "--.--.";
            document.getElementById("spiel_zeit").innerText = "--:--";
            document.getElementById("countdown_box").innerText = "--";
            offeneTippsBerechnen();
            return;
        }

        const { data: spiel, error } = await supabase
            .from("spiele")
            .select('team_a, team_b, Startzeit, "Spiel_fertig?", tore_team_a, tore_team_b')
            .eq("id", id)
            .single();

        if (meineLadeId !== spielLadeId) return;
        if (error) {
            alert("Fehler beim Laden der Spieldaten von ID " + id);
            console.error(error);
            return;
        }

        document.getElementById("team_a").innerText = spiel.team_a;
        document.getElementById("team_b").innerText = spiel.team_b;
        setzeFlagge(spiel.team_a, "img_flag_a");
        setzeFlagge(spiel.team_b, "img_flag_b");

    async function spieleListeLaden() {
        const { data: spiele, error } = await supabase
        .from("spiele")
        .select('id, team_a, team_b, name, Startzeit, "Spiel_fertig?"') 
        .eq("spiel_freigeschaltet", true) 
        .order("id", { ascending: true });

        if (error) {
            console.error("Fehler beim Laden der Spieleliste:", error.message);
            return;
        }

        const select = document.getElementById("spiel_select");
        select.innerHTML = '<option value="" disabled>-- Bitte wählen --</option>';

        if (spiele) {
            spiele.forEach(spiel => {
                const option = document.createElement("option");
                option.value = spiel.id;
                option.text = spiel.name || `${spiel.team_a} gegen ${spiel.team_b}`; 
                select.appendChild(option);
            });

            const jetztMs = new Date().getTime();
            let closestSpielId = spiele[0].id;
            let minDiffZukunft = Infinity;
            let minDiffVergangenheit = Infinity;
            let pastClosestId = spiele[0].id;

            spiele.forEach(spiel => {
                if (spiel.Startzeit && !spiel["Spiel_fertig?"]) {
                    const spielMs = new Date(spiel.Startzeit).getTime();
                    const diff = spielMs - jetztMs;

                    if (diff >= 0) {
                        if (diff < minDiffZukunft) {
                            minDiffZukunft = diff;
                            closestSpielId = spiel.id;
                        }
                    } else {
                        if (Math.abs(diff) < minDiffVergangenheit) {
                            minDiffVergangenheit = Math.abs(diff);
                            pastClosestId = spiel.id;
                        }
                    }
                }
            });

            if (minDiffZukunft !== Infinity) {
                select.value = closestSpielId;
            } else if (minDiffVergangenheit !== Infinity) {
                select.value = pastClosestId;
            } else if (spiele.length > 0) {
                select.value = spiele[0].id;
            }
        }

        await spielLaden();
        starteBegruessungAnim();
    }

        {
            counterSpan.innerText="--";
            return;
        }

        const getippteSpielIDs = new Set(tipps.map(t => String(t.spiel_ID)));
        let offeneTipps = 0;

        spiele.forEach(spiel => {

                const istFertig = spiel["Spiel_fertig?"];
                const startzeitMs = spiel.Startzeit ? new Date(spiel.Startzeit).getTime() : 0;

    async function spielWechseln(richtung) {
        const select = document.getElementById("spiel_select");
        const currentIndex = select.selectedIndex;
        const totalOptions = select.options.length;

        if (totalOptions <= 1) return;
        let newIndex = currentIndex + richtung;

        if (newIndex < 1) {
            newIndex = totalOptions - 1;
        } else if (newIndex >= totalOptions) {
            newIndex = 1;
        }

        select.selectedIndex = newIndex;
        await spielLaden();
    }

     function punkteBerechnen(spielID, tippA, tippB) {
        if (spiele[spielID]["Spiel_fertig?"]) {
            const spiel = spiele.find(s => s.id === spielID);
            if (!spiel) return 0;

            let temp1 = spiel.tore_team_a - spiel.tore_team_b;
            let temp2 = tippA - tippB;

            if (temp1 == temp2 && tippA == spiel.tore_team_a) {
                return points_for_l1_prediction;
            } else if (temp1 == temp2 && temp1 != 0) {
                return points_for_l2_prediction;
            } else if (temp1 == temp2 && temp1 == 0) {
                return points_for_draw_prediction;
            } else if (Math.sign(temp1) == Math.sign(temp2)) {
                return points_for_l3_prediction;
            } else {
                return 0;
            }
        } else {
            return 0;
        }
    }

     function gesPunkteBerechnen(tipper_ID) {
        const tippsDesUsers = tipps.filter(tipp => tipp.tipper_ID === tipper_ID);

        let answer = 0;

        for (let i = 0; i < tippsDesUsers.length; i++) {
            const spiel = spiele.find(s => s.id === tippsDesUsers[i].spiel_ID);
            if (!spiel) continue;

            if (spiel.tore_team_a == null || spiel.tore_team_b == null) {
                continue;
            }

            answer +=  punkteBerechnen(
                tippsDesUsers[i].spiel_ID,
                tippsDesUsers[i].tore_team_a,
                tippsDesUsers[i].tore_team_b
            );
        }

        return answer;
    }

    // DOC 2: fold/wave easter egg triggered by 6:7 tip or searching "67"
    function trigger67Effekt() {
        const STRIP_COUNT = 101;
        const OVERLAP = 4;
        const wrapper = document.createElement('div');
        wrapper.id = 'fold67-wrapper';

        const pageWidth = window.innerWidth;
        const stripWidth = pageWidth / STRIP_COUNT;
        const strips = [];

        for (let i = 0; i < STRIP_COUNT; i++) {
            const strip = document.createElement('div');
            strip.className = 'fold67-strip';

            const left = i * stripWidth - OVERLAP;
            strip.style.left = left + 'px';
            strip.style.width = (stripWidth + OVERLAP * 2) + 'px';
            strip.style.zIndex = i;

            const center = (STRIP_COUNT - 1) / 2;
            const d = (i - center) / center;
            strip.style.setProperty('--d', d.toFixed(3));

            const inner = document.createElement('div');
            inner.className = 'fold67-strip-inner';
            inner.style.width = pageWidth + 'px';
            inner.style.left = -left + 'px';
            inner.innerHTML = document.body.innerHTML;

            strip.appendChild(inner);
            wrapper.appendChild(strip);
            strips.push(strip);
        }

        document.body.appendChild(wrapper);
        document.body.classList.add('fold67-hide-original');

        requestAnimationFrame(() => {
            strips.forEach(s => s.classList.add('active'));
        });

        setTimeout(() => {
            document.body.classList.remove('fold67-hide-original');
            wrapper.remove();
        }, 1550);
    }

    window.addEventListener("click", (e) => {
        const badge = document.getElementById("info_badge_tips");
        const badge2 = document.getElementById("punkte_info");

        if (badge && !e.target.closest("#info_badge_tips")) {
            badge.classList.remove("active");
        }

        if (badge2 && !e.target.closest("#punkte_info")) {
            badge2.classList.remove("active");
        }

        const err = document.getElementById("limit-error");
        if (err) err.classList.remove("active");
    });

    </script> 
</body>
