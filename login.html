<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body {
  font-family: Arial, sans-serif;
  background-image: url("rasen chatgpt.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  margin: 0;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

    #header {
  display: flex;
  justify-content: center;
}

    #logo-container {
      position: relative;
      display: inline-block;
    }

    #logo {
      width: 510px;
      height: auto;
    }

    #ball-wrapper {
      position: absolute;
      left: 15.2%;
      top: 56%;
      transform: translate(-50%, -50%);
      animation: flug 1.5s ease-out forwards;
    }

    #ball {
      width: 26px;
      height: 26px;
      animation: spin 15s linear infinite;
    }

    #container {
  width: 450px;
  margin-top: 10px;
  padding: 30px;
  background: transparent;
}

    #container h2,
    #container p,
    #container a {
      color: white;
    }

    input {
  width: 100%;
  padding: 16px;
  border-radius: 8px;
  border: none;
  font-size: 20px;
  box-sizing: border-box;
}

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

     .register-link {
    display: block;
    font-size: 24px;   /* Größe anpassen */
    font-weight: bold;
    margin-bottom: 20px;
    color: #0077cc;
    text-decoration: none;
}

.register-link:hover {
    text-decoration: underline;
}

    .underline {
    text-decoration: underline;
}

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes flug {
  from {
    transform:
      translate(-50%, -50%)
      translate(430px, 400px)
      scale(4);      /* Start: 4-mal so groß */
  }

  to {
    transform:
      translate(-50%, -50%)
      translate(0, 0)
      scale(1);      /* Endgröße = aktuelle Größe (26px) */
  }
}
  </style>
</head>

<body>

  <div id="header">
    <div id="logo-container">
      <img id="logo" src="logo mit titel final.png" alt="WiG Tippspiel">

      <span id="ball-wrapper">
        <img id="ball" src="fussball_ohne_schatten.png" alt="Ball">
      </span>
    </div>
  </div>
  <div id="container">
    <a href="signup.html" class="register-link">
        Neu hier? Dann <span class="underline">hier registrieren!</span>
    </a>
    <h2>Login</h2>

    <input id="email" type="email" placeholder="Email" />
    <br /><br />
    <input id="password" type="password" placeholder="Password" />
    <br /><br />

    <button id="login">Login</button>
    <br/><br/>
    <button id="pswd-reset">Passwort zurücksetzen</button>

    <p id="status"></p>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const supabaseUrl = "https://kmhwwdsuzphkpfupkynf.supabase.co";
      const supabaseKey = "sb_publishable_7ih4VSPUkXVfHkBa7lrDCA_mO_d0pW1";

      const supabase = createClient(supabaseUrl, supabaseKey);
      
    //falls Nutzer schon eingeloggt ist!
      const { data: {session}} = await supabase.auth.getSession();
      if(session)
      {
        window.location.replace("index.html");
      }
      
      function validateEmail(email) {
        // Regulärer Ausdruck für die grundlegende E-Mail-Syntax
        const regex = /^\S+@\S+\.\S+$/;
        return regex.test(email);
      }

      async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if(email===""||password===""){
          document.getElementById("status").innerText ="Bitte E-Mail und Passwort eingeben.";
          return;
        }
        
        if(!validateEmail(email)){
          document.getElementById("status").innerText ="Bitte gültige E-Mail eingeben.";
          return;
        }

        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          let msg;
  
          switch (error.message) {
            case "Invalid login credentials":
              msg = "Die E-Mail-Adresse oder das Passwort ist falsch.";
              break;
  
            case "Email not confirmed":
              msg = "Bitte bestätige zuerst deine E-Mail-Adresse.";
              break;
  
            case "Too many requests":
              msg = "Zu viele Anmeldeversuche. Bitte versuche es später erneut.";
              break;
  
            default:
              msg = "Die Anmeldung ist fehlgeschlagen. Bitte versuche es erneut.";
          }

          document.getElementById("status").innerText = msg;
          return;
        }

        window.location.replace("index.html");
      }

      async function reset(){
        const email = document.getElementById("email").value;
        if(email===""){
          document.getElementById("status").innerText="Bitte E-Mail-Adresse eingeben.";
          return;
        }
        if(!validateEmail(email)){
          document.getElementById("status").innerText="Bitte gültige E-Mail-Adresse eingeben.";
          return;
        }
        const { data, error } = await supabase.auth.resetPasswordForEmail(email, {redirectTo: 'https://www.wig-wm.de/update-password.html'});
        if(error){
          document.getElementById("status").innerText=error.message;
        }

      document.getElementById("status").innerText = "E-Mail zum Zurücksetzen wurde verschickt.";
      }

      

      document.getElementById("login").addEventListener("click", login);
      document.getElementById("pswd-reset").addEventListener("click", reset);

    </script>
  </div>
</body>
</html>
