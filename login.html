<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css">
  <title>Supabase Login Demo</title>
</head>
<body>
  <div id="container">
    <h2>Login</h2>

    <input id="email" type="email" placeholder="Email" />
    <br /><br />
    <input id="password" type="password" placeholder="Password" />
    <br /><br />

    <button id="login">Login</button>
    <br/><br/>
    <a href="signup.html">Registrieren</a>

    <p id="status"></p>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const supabaseUrl = "https://kmhwwdsuzphkpfupkynf.supabase.co";
      const supabaseKey = "sb_publishable_7ih4VSPUkXVfHkBa7lrDCA_mO_d0pW1";

      const supabase = createClient(supabaseUrl, supabaseKey);

      async function redirect(){
        // Session abfragen und Userdaten extrahieren
        const { data: { session } } = await supabase.auth.getSession();
        const user = session.user;
        //Wenn schon eingeloggt -> Überprüfung, ob Profil vervollständigt ist Ja->index.html | Nein->profil.html
        if (session) {
          const { count, error } = await supabase
            .from('users')
            .select('*', { count: 'exact', head: true })
            .eq('user_ID', user.id);

          if(error || count<1){
            window.location.href = "profil.html"
          }else{
            window.location.href = "index.html";
          }
        }
      }

      async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          document.getElementById("status").innerText = error.message;
        } else {
          redirect();
        }
      }

      redirect();

      document.getElementById("login").addEventListener("click", login);

    </script>
  </div>
</body>
</html>
