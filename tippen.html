<!DOCTYPE html> 
<html lang="de"> 
<head> 
    <meta charset="UTF-8"> 
    <title>WM 2026 Tippspiel</title> 
  <style>
      
@font-face {
      font-family: 'MeineSchrift';
      src: url('GREGH___.ttf');
    }

    body {
      font-family: Arial, sans-serif;
      background-image: url("rasen chatgpt.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      text-align: center;
      margin: 40px;
      padding-top: 200px;
      position: relative;
    }
      
 #header {
      display: flex;
      flex-direction: row;   /* Nebeneinander auch auf dem Smartphone */
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: -120px;
      text-align: center;
      flex-wrap: wrap;       /* Verhindert Überlaufen auf kleinen Displays */
    }

      
    #title {
      position: relative;
      top: 0;
      left: 0;
      font-size: clamp(40px, 6vw, 120px);
      color: white;
    }

      /* evlt entsorgen: 
    #wirsberg-logo {
      height: 150px;
    }
*/

    #logo-container {
      position: relative;
      display: inline-block;
    }

    #logo {
        display: inline-block;
        position: relative;
        left: 20px;   
        right: 20px;  
        top: 10px;    
        bottom: 10px; 
        font-size: 90px;
        
        /*hier ÄNderungen von Steven -- >nochmal abgleichen mit Max Gr.*/
        font-family: 'MeineSchrift', sans-serif; 
        color: white;
        font-weight: bold;
        letter-spacing: 0px;
        text-shadow: 3px 3px 8px rgba(0,0,0,0.3);
    }

    #ball-wrapper {
      position: absolute;
      left: 21%%;
      top: 68,5%;
      transform: translate(-50%,-50%);
      animation: flug 1.5s ease-out forwards;
    }

    #ball {
      width: 20px;
      height: 20px;
      font-size: 38px;
      line-height: 44px;
      position: relative;
      z-index: 2;
      display: inline-block;
      animation: spin 15s linear infinite;
    }


    #name {
      margin-top: 50px;
    }

    label {
      font-size: 28px;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }

    #team_a, #team_b {
      font-size: 28px;
      color: white;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    }

    .cursor {
      animation: blink 0.8s infinite;
      color: white;
      font-weight: bold;
      margin-left: 2px;
    }
