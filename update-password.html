<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>

  <style>
    body {
  font-family: Arial, sans-serif;
  background-image: url("rasen chatgpt.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  margin: 0;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  transform: scale(0.8);
  transform-origin: center;
}


#header {
  display: flex;
  justify-content: center;
}

#logo-container {
  position: relative;
  display: inline-block;
}

#logo {
  width: 510px;
  height: auto;
}

#ball-wrapper {
  position: absolute;
  left: 15.2%;
  top: 56%;
  transform: translate(-50%, -50%);
  animation: flug 1.5s ease-out forwards;
}

#ball {
  width: 26px;
  height: 26px;
  animation: spin 15s linear infinite;
}

.box {
  width: 450px;
  margin-top: 10px;
  padding: 30px;
  background: transparent;
}

.box h1,
.box p,
.message {
  color: white;
}

label{
  color: lightgray;
}

p{
  font-size: 1.1em;
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 8px;
  border: none;
  font-size: 20px;
  box-sizing: border-box;
}

button {
  width: 100%;
  margin-top: 30px;   /* schiebt den Button weiter nach unten */
  padding: 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 18px;
  background: #3ecf8e; /* Grün */
  color: white;
  font-weight: bold;
}

button:disabled {
  opacity: 0.6;
}

.success {
  color: #7dff7d;
}

.error {
  color: #ff9b9b;
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

@keyframes flug {
  from {
    transform:
      translate(-50%, -50%)
      translate(430px, 400px)
      scale(4);      /* Start: 4-mal so groß */
  }

  to {
    transform:
      translate(-50%, -50%)
      translate(0, 0)
      scale(1);      /* Endgröße = aktuelle Größe (26px) */
  }
}

  </style>
</head>

<body>
  <div id="header">
  <div id="logo-container">
    <img id="logo" src="logo mit titel final.png" alt="WiG Tippspiel">

    <span id="ball-wrapper">
      <img id="ball" src="fussball_ohne_schatten.png" alt="Ball">
    </span>
  </div>
</div>
  <div class="box">
    <h1>Passwort zurücksetzen</h1>
    <p>Geben Sie ihr neues Passwort ein</p>

    <form id="resetForm">
      <label for="password">Neues Passwort</label>
      <br/>
      <input
        type="password"
        id="password"
        required
        minlength="6"
        placeholder="Neues Passwort"
      />
      <br/><br/>
      <label for="confirmPassword">Neues Passwort bestätigen</label>
      <br/>
      <input
        type="password"
        id="confirmPassword"
        required
        minlength="6"
        placeholder="Neues Passwort bestätigen"
      />

      <button type="submit" id="submitBtn">Passwort updaten</button>

      <div id="message" class="message"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="module">
   import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://kmhwwdsuzphkpfupkynf.supabase.co";
    const supabaseKey = "sb_publishable_7ih4VSPUkXVfHkBa7lrDCA_mO_d0pW1";

    const supabase = createClient(supabaseUrl, supabaseKey);

    const form = document.getElementById("resetForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      if (password.length < 6) {
        showMessage("Password must be at least 6 characters long.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating...";

      const { data, error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        showMessage(error.message, "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Update Password";
        return;
      }

      showMessage("Password updated successfully. You can now log in.", "success");

      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    });
  </script>
</body>
</html>
