<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>WM-Tippspiel</title>
</head>
<body>
  <h2>Profil vervollständigen</h2>

  <input id="username" type="text" placeholder="Benutzername"/>
  <br/><br/>
  <input id="surname" type="text" placeholder="Vorname"/>
  <br/><br/>
  <input id="name" type="text" placeholder="Nachname"/>
  <br/><br/>

  <button id="signup">vervollständigen</button>

  <p id="status"></p>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://kmhwwdsuzphkpfupkynf.supabase.co";
    const supabaseKey = "sb_publishable_7ih4VSPUkXVfHkBa7lrDCA_mO_d0pW1";

    const supabase = createClient(supabaseUrl, supabaseKey);

    // redirect if already logged in
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = "login.html";
    }

    async function signup() {
      const username = document.getElementById("username").value;
      const surname = document.getElementById("surname").value;
      const name = document.getElementById("name").value;
      
      const { error } = await supabase
        .from("users")
        .insert([
          {
            Vorname: surname,
            Name: name,
            username: username
          }
        ]);

      document.getElementById("status").innerText =
        error ? error.message : "Signup erfolgreich!";
    }

    document.getElementById("signup").addEventListener("click", signup);

  </script>
</body>
</html>
