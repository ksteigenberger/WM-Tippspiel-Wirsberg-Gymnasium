<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css">
  <title>WM-Tippspiel</title>
</head>
<body>
  
  <div id="container">
    <a href="index.html">Startseite</a>
    <h2>Profil vervollständigen</h2>

    <input id="username" type="text" placeholder="Benutzername"/>
    <br/><br/>
    <input id="surname" type="text" placeholder="Vorname"/>
    <br/><br/>
    <input id="name" type="text" placeholder="Nachname"/>
    <br/><br/>

    <button id="signup">vervollständigen</button>

    <p id="status"></p>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const supabaseUrl = "https://kmhwwdsuzphkpfupkynf.supabase.co";
      const supabaseKey = "sb_publishable_7ih4VSPUkXVfHkBa7lrDCA_mO_d0pW1";

      const supabase = createClient(supabaseUrl, supabaseKey);

      // Session holen, um Daten des Users auslesen zu können. Keine Session->Weiterleitung zum login.html
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
      }

      async function loadData(){
        const { data, error } = await supabase
          .from('users')
          .select('Vorname, Name, username')
          .eq('user_ID', user.id)
          .single();
        if(!error){
          
          document.getElementById("username").value = data.username;
          document.getElementById("surname").value = data.Vorname;
          document.getElementById("name").value = data.Name;
          
          document.getElementById("username").readonly = true;
          document.getElementById("surname").readonly = true;
          document.getElementById("name").readonly = true;

        }
      }

      async function signup() {
        const username = document.getElementById("username").value;
        const surname = document.getElementById("surname").value;
        const name = document.getElementById("name").value;
        
        const { error } = await supabase
          .from("users")
          .insert([
            {
              Vorname: surname,
              Name: name,
              username: username
            }
          ]);

        document.getElementById("status").innerText =
          error ? error.message : "Profil erfolgreich geändert!";
      }

      document.getElementById("signup").addEventListener("click", signup);
      loadData();

    </script>
  </div>
</body>
</html>
