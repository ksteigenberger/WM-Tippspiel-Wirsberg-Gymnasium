<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Profilseite</title>

   <style>
    body {
        font-family: Arial, sans-serif;
        background-image: url("rasen chatgpt.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
      max-width: 250px;
      margin: 12px auto;
      background: white;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      font-size: 24px;
    }

    .profil {
      max-width: 560px;
      margin: 12px auto;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .profil p {
      padding: 12px 14px;
      background: #f8fafc;
      border-radius: 10px;
      margin: 0 0 12px;
      font-size: 19px;
    }

    #ausgabe {
      max-width: 500px;
      margin: 16px auto 0;
      color: #b91c1c;
      font-weight: bold;
    }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 100%;
      margin: 0;
      padding: 12px 16px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(4px);
      z-index: 1000;
    }

    footer p {
      margin: 0;
      line-height: 1.6;
    }

    footer a {
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .nav-button {
      background: #ff0000;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-button:hover {
      background: #ff2335;
    }

    .blue-button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    .blue-button:hover {
      background: #1d4ed8;
    }

    .form-card {
      max-width: 560px;
      margin: 0 auto 24px;
      background: #f8fafc;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
      box-sizing: border-box;
    }

    .form-card h2 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 22px;
    }

    .form-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 18px;
      box-sizing: border-box;
    }

    .profile-avatar-wrapper {
      width: 140px;
      height: 140px;
      margin: 0 auto 18px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #e2e8f0;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-placeholder {
      color: #64748b;
      font-size: 18px;
      text-align: center;
      padding: 8px;
    }

    .avatar-selector {
      margin: 14px 0 18px;
    }

    .avatar-selector p {
      margin: 0 0 10px;
      font-weight: 600;
      font-size: 18px;
    }

    .avatar-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .avatar-option {
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      background: white;
      padding: 4px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      width: 92px;
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0 auto;
    }

    .avatar-option:hover {
      transform: scale(1.03);
      border-color: #ef4444;
    }

    .avatar-option.selected {
      border-color: #ef4444;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
    }

    .avatar-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }
  </style>

</head>
<body>

    <h1>Mein Profil</h1>

    <div class="profil">
        <div class="profile-avatar-wrapper">
            <img id="avatar_preview" class="profile-avatar" src="" alt="Profilavatar" style="display:none;" />
            <div id="avatar_placeholder" class="avatar-placeholder">Noch kein Avatar gewählt</div>
        </div>
        <p><strong>Name:</strong> <span id="name"></span></p>
        <p><strong>Benutzername:</strong> <span id="username"></span></p>
        <p><strong>E-Mail:</strong> <span id="email"></span></p>
    </div>

    <div id="profile_completion" class="form-card" style="display: none;">
        <h2>Profil vervollständigen</h2>
        <input id="input_vorname" type="text" placeholder="Vorname" />
        <input id="input_name" type="text" placeholder="Nachname" />
        <input id="input_username" type="text" placeholder="Benutzername" />
        <div class="avatar-selector">
            <p>Avatar auswählen:</p>
            <div id="avatar_options" class="avatar-options"></div>
        </div>
        <button id="save-profile" class="blue-button" style="margin-top:8px;">Profil speichern</button>
        <p id="status" style="margin-top:12px; color:#b91c1c;"></p>
    </div>

    <div id="ausgabe"></div>

    <footer>
      <p>
        <a href="index.html"><button class="blue-button" type="button">Startseite</button></a> |
        <a href="datenschutzerklärung.html">Datenschutzerklärung</a>  |
        <a href="impressum.html">Impressum</a>    | 
        <button id="logout" class="nav-button">Logout</button> 
      </p>
    </footer>

    <script src="avatare/avatars.js"></script>
    
 <!--Logik und DB-Verbindung mit JavaScript -->
  <script type="module">

    
     //---------------------------------------------------------------------
    //Supabase Verbindung (nicht ändern!!)
    //----------------------------------------------------------------------
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://kmhwwdsuzphkpfupkynf.supabase.co";
    const supabaseKey = "sb_publishable_7ih4VSPUkXVfHkBa7lrDCA_mO_d0pW1";

    const supabase = createClient(supabaseUrl, supabaseKey);

    const avatarFiles = window.avatarFiles || [];

    let selectedAvatar = "";

    function getAvatarUrl(fileName) {
        return fileName ? `avatare/${fileName}` : "";
    }

    function setAvatarPreview(fileName) {
        const preview = document.getElementById("avatar_preview");
        const placeholder = document.getElementById("avatar_placeholder");

        if (fileName) {
            preview.src = getAvatarUrl(fileName);
            preview.style.display = "block";
            placeholder.style.display = "none";
        } else {
            preview.src = "";
            preview.style.display = "none";
            placeholder.style.display = "flex";
        }
    }

    function renderAvatarOptions() {
        const container = document.getElementById("avatar_options");
        container.innerHTML = "";

        avatarFiles.forEach((fileName) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "avatar-option";
            button.dataset.avatar = fileName;
            button.innerHTML = `<img src="${getAvatarUrl(fileName)}" alt="${fileName}" />`;

            button.addEventListener("click", () => {
                selectedAvatar = fileName;
                document.querySelectorAll(".avatar-option").forEach((option) => {
                    option.classList.toggle("selected", option.dataset.avatar === fileName);
                });
                setAvatarPreview(fileName);
            });

            container.appendChild(button);
        });
    }

    function markSelectedAvatar(fileName) {
        selectedAvatar = fileName || "";
        document.querySelectorAll(".avatar-option").forEach((option) => {
            option.classList.toggle("selected", option.dataset.avatar === fileName);
        });
        setAvatarPreview(fileName);
    }

    async function loadProfile() {
        const { data: { session }, error: authError } = await supabase.auth.getSession();

        if (authError || !session) {
            window.location.href = "login.html";
            return;
        }

        const user = session.user;
        document.getElementById("email").innerText = user.email || "-";

        const { data: profile, error } = await supabase
            .from("users")
            .select("username, Vorname, Name, avatar")
            .eq("user_ID", user.id)
            .maybeSingle();

        if (error) {
            document.getElementById("ausgabe").innerText = error.message;
            return;
        }

        const profileStatus = document.getElementById("profile_status");

        if (!profile) {
            if (profileStatus) {
                profileStatus.innerText = "Profil unvollständig";
            }
            document.getElementById("profile_completion").style.display = "block";
            document.getElementById("name").innerText = "-";
            document.getElementById("username").innerText = "-";
            markSelectedAvatar("");
            return;
        }

        const isComplete = Boolean(profile.username && profile.Vorname && profile.Name && profile.avatar); 

        if (profileStatus) {
            profileStatus.innerText = isComplete ? "Profil vollständig" : "Profil unvollständig";
        }
        document.getElementById("name").innerText = `${profile.Vorname || ""} ${profile.Name || ""}`.trim();
        document.getElementById("username").innerText = profile.username || "-";
        document.getElementById("input_vorname").value = profile.Vorname || "";
        document.getElementById("input_name").value = profile.Name || "";
        document.getElementById("input_username").value = profile.username || "";
        markSelectedAvatar(profile.avatar || "");
        document.getElementById("profile_completion").style.display = isComplete ? "none" : "block";
    }

    async function saveProfile() {
        const { data: { session }, error: authError } = await supabase.auth.getSession();
        if (authError || !session) {
            window.location.href = "login.html";
            return;
        }

        const user = session.user;
        const vorname = document.getElementById("input_vorname").value.trim();
        const name = document.getElementById("input_name").value.trim();
        const username = document.getElementById("input_username").value.trim();
        const status = document.getElementById("status");

        status.innerText = "";

        if (!vorname || !name || !username || !selectedAvatar) {
            status.innerText = "Bitte Vorname, Nachname, Benutzername und Avatar auswählen.";
            return;
        }

        const { error } = await supabase.from("users").upsert([
            {
                user_ID: user.id,
                username: username,
                Vorname: vorname,
                Name: name,
                avatar: selectedAvatar
            }
        ], { onConflict: "user_ID" });

        if (error) {
            status.innerText = error.message;
            return;
        }

        await loadProfile();
        status.innerText = "Profil gespeichert.";
    }

    async function logout() {
        await supabase.auth.signOut();
        window.location.href = "login.html";
    }

    renderAvatarOptions();
    document.getElementById("logout").addEventListener("click", logout);
    document.getElementById("save-profile").addEventListener("click", saveProfile);

    loadProfile();

</script> 
</body>
</html>
