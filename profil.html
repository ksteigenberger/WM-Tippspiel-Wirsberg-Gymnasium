<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Profilseite</title>

   <style>
    body {
        font-family: Arial, sans-serif;
        background-image: url("rasen chatgpt.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

    h1 {
      text-align: center;
      margin-bottom: 24px;
      max-width: 250px;
      margin: 12px auto;
      background: white;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .profil {
      max-width: 500px;
      margin: 12px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .profil p {
      padding: 12px 14px;
      background: #f8fafc;

    #ausgabe {
      max-width: 500px;
      margin: 16px auto 0;

    }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 100%;
      margin: 0;
      padding: 12px 16px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(4px);
      z-index: 1000;
    }

    footer p {
      margin: 0;
      line-height: 1.6;
    }

    footer a {
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>

</head>
<body>

    <h1>Mein Profil</h1>

    <div class="profil">
        <p><strong>Name:</strong> <span id="name"></span></p>
        <p><strong>Benutzername:</strong> <span id="username"></span></p>
        <p><strong>E-Mail:</strong> <span id="email"></span></p>
    </div>

    <div id="ausgabe"></div>

    <footer>
      <p>
        <a href="index.html">Startseite</a> |
        <a href="datenschutzerklärung.html">Datenschutzerklärung</a>  |
        <a href="impressum.html">Impressum</a>    | 
        <button id="logout">Logout</button> 
      </p>
    </footer>
    
 <!--Logik und DB-Verbindung mit JavaScript -->
  <script type="module">

    
     //---------------------------------------------------------------------
    //Supabase Verbindung (nicht ändern!!)
    //----------------------------------------------------------------------
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://kmhwwdsuzphkpfupkynf.supabase.co";
    const supabaseKey = "sb_publishable_7ih4VSPUkXVfHkBa7lrDCA_mO_d0pW1";

    const supabase = createClient(supabaseUrl, supabaseKey);

    //Session holen, um Daten des Users auslesen zu können. Keine Session->Weiterleitung zum login.html
    //const { data: { session } } = await supabase.auth.getSession();
    //if (!session) {
    //    window.location.href = "login.html";
    //}

   async function loadProfile(username) 
   {

    const { data: users,error:  errorusers} = await supabase.from("users").select("*");
     if(errorusers)
     {
        document.getElementById("ausgabe").innerText=errorusers.message;
        return;
     }

     let indexUser = -1; 

     for(let i = 0; i < users.length; i++)
     {
        if(username == users[i].username)
        {
            indexUser = i;
        }
     }

    document.getElementById("name").innerText=users[indexUser].Vorname + " " + users[indexUser].Name;
    document.getElementById("username").innerText=users[indexUser].username;
    //document.getElementById("email").innerText=users[indexUser].email;
    }

    // WICHTIG: Funktion starten
    loadProfile("EmelieErdbeer");

      //Logout Funktion
    async function logout() {
        await supabase.auth.signOut();
        document.getElementById("status").innerText = "Ausgeloggt";
    }

    //Funktion mit Logout-Button verbinden
    document.getElementById("logout").addEventListener("click", logout); 

</script> 
</body>
</html>
