// Funktion zum sortieren und einfuegen in das Array

async function ranglisteEintragen()
{


    for(let i = 0; i < users.length; i++)
    {
        let gesamtPunkte = await gesPunkteBerechnen(users[i].user_ID);
        rangliste.push({
            user_ID: users[i].user_ID,
            punkte: gesamtPunkte
        });

    }
    rangliste.sort((a, b) => b.punkte - a.punkte);
    

}



async function punkteBerechnen(spielID, tippA, tippB)
{

  let temp1 = spiele[spielID].tore_team_a - spiele[spielID].tore_team_b;
  //arr_result_goals_A[i] - arr_result_goals_B[i];
        let temp2 = tippA - tippB;
        //matrix_predict_goals_A[j][i] - matrix_predict_goals_B[j][i];

          if ( temp1 == temp2 && tippA == spiele[spielID].tore_team_a)
          {
            return points_for_l1_prediction;
          }
          else
          {
            if ( temp1 == temp2 && temp1 != 0)
            {
              return points_for_l2_prediction;
            }
            else
            {
                if ( temp1 == temp2 && temp1 == 0)
                {
                  return points_for_draw_prediction;
                }
              else
              {
                if ( Math.sign(temp1) == Math.sign(temp2) )
                {
                  return points_for_l3_prediction;
                }
                else
                {
                  return 0;
                }
              }
            }
      
          }

}

async function gesPunkteBerechnen(tipper_ID)
{
    const { data: tipps, error: errortipps } = await supabase.from("tipps").select("*").eq("tipper_ID", tipper_ID);
    if(errortipps)
    {
        document.getElementById("ausgabe").innerText=errortipps.message;
        return;
    }
    let answer = 0;
    for(let i = 0; i < tipps.length; i++)
    {
        answer = answer + await punkteBerechnen(tipps[i].spiel_ID, tipps[i].tore_team_a, tipps[i].tore_team_b)
    }
    return answer;
}

        pktVorher = gesPunkte;
    }
    await variableSpalteLaden(aktuellesSpiel);
}


// Funktion zum Laden von der Spalte mit Tipps

async function variableSpalteLaden(spielId)
{
    const { data: tipps, error: errortipps } = await supabase.from("tipps").select("*").eq("spiel_ID", spielId);
    const { data: spiele, error: errorspiele} = await supabase.from("spiele").select("*").order("id", {ascending: true});
    if(errortipps)
    {
        document.getElementById("ausgabe").innerText=errortipps.message;
        return;
    }
    if(errorspiele)
    {
        document.getElementById("ausgabe").innerText=errorspiele.message;
        return;
    }
    document.getElementById("spielT").innerText=spiele[spielId].team_a + " - " + spiele[spielId].team_b + "\n" + spiele[spielId].tore_team_a + " : " + spiele[spielId].tore_team_b;
    const tabelle = document.getElementById("tabelle1");
    let temp1 = false;
    for(let i=0; i<rangliste.length;i++)
    {
        temp1 = false;
        for(let j=0; j < tipps.length; j++)
        {
            if(rangliste[i].user_ID == tipps[j].tipper_ID && tipps[j].spiel_ID == spielId)
            {
                let punkte = await punkteBerechnen(aktuellesSpiel, tipps[j].tore_team_a, tipps[j].tore_team_b);
                temp1 = true;     
                tabelle.rows[i].cells[3].innerHTML =
                    `${tipps[j].tore_team_a} : ${tipps[j].tore_team_b}<sup>${punkte}</sup>`;
                break;
            }
        }
          
        if (temp1 == false)
        {
           tabelle.rows[i].cells[3].innerHTML =
            `- : -<sup>0</sup>`;
        }

    }
}
// Funktion fuer die Pfeile
async function spielRechts(w)
{
    //const tabelle = document.getElementById("tabelle1");
    //tabelle.innerHTML = "";
    if(w && aktuellesSpiel != 15)
    {
        aktuellesSpiel += 1;
    }
    else if(!w && aktuellesSpiel != 0)
    {
        aktuellesSpiel -= 1;
    }
    else if(w && aktuellesSpiel == 15)
    {
        aktuellesSpiel = 0;
    }
    else
    {
        aktuellesSpiel = 15;
    }
    await variableSpalteLaden(aktuellesSpiel);
}
await ranglisteEintragen();

//Suchfeld code
function spielerSuchen() {
    const suchtext = document.getElementById("suche").value.toLowerCase();
    const zeilen = document.querySelectorAll("#tabelle1 tr");

    zeilen.forEach(zeile => {
        const username = zeile.cells[1].textContent.toLowerCase();

        if (username.includes(suchtext)) {
            zeile.style.display = "";
        } else {
            zeile.style.display = "none";
        }
    });
}

document.getElementById("suche").addEventListener("input", spielerSuchen);
document.getElementById("weiter").addEventListener("click", function() {
spielRechts(true);});
document.getElementById("zurueck").addEventListener("click", function() {
spielRechts(false);});
