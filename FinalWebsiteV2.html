<!DOCTYPE html>

<head>

  <style>
   body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;   /* WICHTIG: vertikal zentrieren */

    padding-top: 120px;            /* entfernen, sonst verschiebt es wieder */

    background-image: url("rasen chatgpt.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    overflow-x: hidden;
}


    #logo {
      width: 510px;
      height: auto;
    }

    #ball-wrapper {
  position: absolute;
  left: 13.3%;
  top: 39%;
  transform: translate(-50%, -50%);
  animation: flug 1.5s ease-out forwards;
  z-index: 10;
}

    #ball {
      width: 24px;
      height: 24px;
      animation: spin 15s linear infinite;
    }


#sonne{
    position:absolute;

    /* Position hinter dem Pokalkopf */
    right: 1px;
    top:6px;

    width:65px;
    height:45px;

    transform-origin:center;
    animation:drehen 20s linear infinite;

    z-index:0;
}

#logo{
    position:relative;
    z-index:2;
}

.strahl{
    position:absolute;

    left:50%;
    top:50%;

    width:6px;
    height:55px;

    background:linear-gradient(
        to top,
        rgba(255,210,0,0),
        rgba(255,230,90,.9)
    );

    border-radius:10px;

    transform:
        translate(-50%,-100%)
        rotate(calc(var(--i) * 30deg));

    transform-origin:center bottom;

    filter:blur(1px);
}

#logo-container {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
}

#rangliste_tools {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.table-shell {
    width: 90%;
    max-width: 1100px;

    display: flex;
    flex-direction: column;
    align-items: center;
}

#spielT {
    display: inline-block;
    text-align: center;
}

th:last-child {
    text-align: center;
}



@keyframes drehen{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes flug {
  from {
    transform:
      translate(-50%, -50%)
      translate(430px, 400px)
      scale(4);      /* Start: 4-mal so groß */
  }

  to {
    transform:
      translate(-50%, -50%)
      translate(0, 0)
      scale(1);      /* Endgröße = aktuelle Größe (26px) */
  }
}




#profil_button:hover {
    background-color: #0052a3;
}

#logout_button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background-color: #e60000;
    color: white;
    cursor: pointer;
}

#logout_button:hover {
    background-color: #b30000;
}





th,
td {
    border: 1px solid #cfcfcf;
    padding: 8px 10px;
    text-align: center;
    font-size: 16pt;
    font-weight: 700;
    height: 42px;
    box-sizing: border-box;
    background: white;
}

thead th {
    background: #ececec;
    font-size: 16pt;
    font-weight: 800;
}

.eigene-zeile {
    background-color: #ffe34d !important;
    font-weight: 900;
}

.eigene-zeile td {
    background-color: #ffe34d !important;
}

#spielT {
    display: inline-block;
    min-width: 180px;
    white-space: pre-line;
    line-height: 1.2;
    font-size: 14px;
}

.scroll-wrapper {
    max-height: 380px;
    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-gutter: stable;

    background: white;
    border-radius: 0 0 10px 10px;
}

#fixedTable {
    border-bottom: none;
}

#fixedTable tr:last-child td {
    border-bottom: none;
}

#restTable tr:first-child td {
    border-top: 1px solid #ccc;
}

@media (max-width: 768px) {

    th,
    td {
        font-size: 13pt;
        padding: 6px 4px;
        height: 38px;
    }

    thead th {
        font-size: 13pt;
    }

    #spielT {
        font-size: 13pt;
        font-weight: bold;
    }

    #suche {
    width: 180px;
    margin-left: 60px;
    font-size: 14px;
}

#rangliste_tools{
    gap:8px;
}

}


  </style>
</head>

<body>

      <div class="strahl" style="--i:4"></div>
      <div class="strahl" style="--i:5"></div>

    <img id="logo" src="logo mit pokal.png" alt="Logo">

  <div id="anzeige"></div> 

 <!-- Suchfeld, Aktualisier Button und Info Kästchen für Punkte Berechnung -->

<div id="rangliste_tools">

    <div style="display:flex; align-items:center; gap:10px;">

</div>

<div id="ausgabe"></div>

    <!-- Fester oberer Bereich -->
<div class="table-shell">
    <table class="rangliste-table" id="fixedTable">
        <colgroup>
            <col class="col-platz">
            <col class="col-user">
            <col class="col-punkte">

        <thead>

</div>

<!-- Scrollbarer Restbereich -->
<div class="scroll-wrapper">
    <table class="rangliste-table" id="restTable">
        <colgroup>
            <col class="col-platz">
            <col class="col-user">
            <col class="col-punkte">
            <col class="col-tipp-rest">
        </colgroup>

        <tbody id="restBody"></tbody>
    </table>
</div>

    <script type="module">

     //---------------------------------------------------------------------
    //Supabase Verbindung (nicht ändern!!)
    //----------------------------------------------------------------------
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://kmhwwdsuzphkpfupkynf.supabase.co";
    const supabaseKey = "sb_publishable_7ih4VSPUkXVfHkBa7lrDCA_mO_d0pW1";

    const supabase = createClient(supabaseUrl, supabaseKey);

    
    let points_for_l1_prediction = 4;
    let points_for_l2_prediction = 3;
    let points_for_l3_prediction = 2;
    let points_for_draw_prediction = 2;
    let aktuellesSpiel = 0;
    let rangliste = [];
    let zeileT = [];
    let spiele = [];
    let users = [];
    let tipps = [];
    let spielLadeId = 0;



    await informationLaden();
    
    async function informationLaden()
    {
        const { data: spiele1, error:  errorspiele} = await supabase.from("spiele").select("*").order("id", {ascending: true});
            if(errorspiele)
            {
            document.getElementById("ausgabe").innerText=errorspiele.message;
            }
    
        const { data: users1, error: errorusers} = await supabase.from("users").select("*");
            if(errorusers)
            {
                document.getElementById("ausgabe").innerText=errorusers.message;
            }
        const { data: tipps1, error: errortipps } = await supabase.from("tipps").select("*");
            if (errortipps) 
            {
                document.getElementById("ausgabe").innerText = errortipps.message;
            }
    
        spiele = spiele1;
        users = users1;
        tipps = tipps1;
    }



        async function ranglisteEintragen() {
        rangliste = [];

        for (let i = 0; i < users.length; i++) {
            let gesamtPunkte = await gesPunkteBerechnen(users[i].user_ID);

            rangliste.push({
                user_ID: users[i].user_ID,
                username: users[i].username,
                punkte: gesamtPunkte
            });
        }

        rangliste.sort((a, b) => b.punkte - a.punkte);

        let rang = 1;
        let letzterPunktestand = null;

        for (let i = 0; i < rangliste.length; i++) {
            if (letzterPunktestand !== null && rangliste[i].punkte < letzterPunktestand) {
                rang = i + 1;
            }
            rangliste[i].rang = rang;
            letzterPunktestand = rangliste[i].punkte;
        }
    }

    function formatPlatz(rang) {
        if (rang === 1) return "🥇 1";
        if (rang === 2) return "🥈 2";
        if (rang === 3) return "🥉 3";
        return `${rang}`;
    }


    // DOC 2: getTippTextForUser fetches fresh from Supabase instead of using cached tipps
    async function getTippTextForUser(userId, spielId) {
        
        if(spiele[spielId]["Spiel_fertig?"])
        {
            const tippDesUsers = tipps.filter(tipp => tipp.spiel_ID === spielId).filter(tipp => tipp.tipper_ID === userId);
    
        if (!tippDesUsers || tippDesUsers.length === 0) {
            return "- : -<sup>0</sup>";
        }
    
        const tipp = tippDesUsers[0];
        const punkte = await punkteBerechnen(spielId, tipp.tore_team_a, tipp.tore_team_b);
    
        return `${tipp.tore_team_a} : ${tipp.tore_team_b}<sup>${punkte}</sup>`;
        }
        else
        {
            return "- : -"
        }
        
    }


    async function renderNormaleAnsicht() {
        const top5Body = document.getElementById("top5Body");
        const ichBody = document.getElementById("ichBody");
        const restBody = document.getElementById("restBody");

        top5Body.innerHTML = "";
        ichBody.innerHTML = "";
        restBody.innerHTML = "";

        if (spiele[aktuellesSpiel]["Spiel_fertig?"]) {
            document.getElementById("spielT").innerText =
                spiele[aktuellesSpiel].team_a + " - " + spiele[aktuellesSpiel].team_b +
                "\n" + spiele[aktuellesSpiel].tore_team_a + " : " + spiele[aktuellesSpiel].tore_team_b;
        } else {
            document.getElementById("spielT").innerText =
                spiele[aktuellesSpiel].team_a + " - " + spiele[aktuellesSpiel].team_b +
                "\n" + "- : -";
        }

        const eigenerEintrag = rangliste.find(e => e.user_ID === currentUserId);
        const top5 = rangliste.slice(0, 5);

        for (const eintrag of top5) {
            const istIch = eintrag.user_ID === currentUserId;
            await renderZeile(top5Body, eintrag, aktuellesSpiel, istIch);
        }

        if (eigenerEintrag && !top5.some(e => e.user_ID === currentUserId)) {
            await renderZeile(ichBody, eigenerEintrag, aktuellesSpiel, true);
        }

        const rest = rangliste.filter(e =>
            !top5.some(t => t.user_ID === e.user_ID) &&
            e.user_ID !== currentUserId
        );

        for (const eintrag of rest) {
            await renderZeile(restBody, eintrag, aktuellesSpiel, false);
        }
    }

    async function ranglisteAktualisieren() {
        document.getElementById("refreshButton").disabled = true;
        document.getElementById("refreshButton").innerHTML = "⟳ Aktualisiere...";

        document.getElementById("top5Body").innerHTML = "";
        document.getElementById("ichBody").innerHTML = "";
        document.getElementById("restBody").innerHTML = "";

        await new Promise(resolve => setTimeout(resolve, 300));

        await informationLaden();

        await ranglisteEintragen();

        const suchtext = document.getElementById("suche").value.trim();

        if (suchtext === "") {
            await renderNormaleAnsicht();
        } else {
            await spielerSuchen();
        }
        
        document.getElementById("refreshButton").innerHTML = "↻ Aktualisieren";
        document.getElementById("refreshButton").disabled = false;
    }

  async function renderZeile(tbody, eintrag, spielId, istEigeneZeile = false)
    {
    const row = tbody.insertRow();



        if (istEigeneZeile) {
            row.classList.add("eigene-zeile");
        }

        row.insertCell().innerText = formatPlatz(eintrag.rang);
        row.insertCell().innerText = istEigeneZeile ? "Ich" : eintrag.username;
        row.insertCell().innerText = eintrag.punkte;

        const tippCell = row.insertCell();
        tippCell.innerHTML = await getTippTextForUser(eintrag.user_ID, spielId);
    }






    async function punkteBerechnen(spielID, tippA, tippB)
    {
        if (spiele[spielID]["Spiel_fertig?"]) {
            const spiel = spiele.find(s => s.id === spielID);
            if (!spiel) return 0;

            let temp1 = spiel.tore_team_a - spiel.tore_team_b;
            let temp2 = tippA - tippB;

            if (temp1 == temp2 && tippA == spiel.tore_team_a) {
                return points_for_l1_prediction;
            } else if (temp1 == temp2 && temp1 != 0) {
                return points_for_l2_prediction;
            } else if (temp1 == temp2 && temp1 == 0) {
                return points_for_draw_prediction;
            } else if (Math.sign(temp1) == Math.sign(temp2)) {
                return points_for_l3_prediction;
            } else {
                return 0;
            }
        } else {
            return 0;
        }
    }

    async function gesPunkteBerechnenZwischenErgebnis(tipper_ID)
    {
        const tippsDesUsers = tipps.filter(tipp => tipp.tipper_ID === tipper_ID);

        let answer = 0;

        for (let i = 0; i < tippsDesUsers.length; i++) {
            const spiel = spiele.find(s => s.id === tippsDesUsers[i].spiel_ID);
            if (!spiel) continue;

            if (spiel.tore_team_a == null || spiel.tore_team_b == null) {
                continue;
            }

            answer += await punkteBerechnen(
                tippsDesUsers[i].spiel_ID,
                tippsDesUsers[i].tore_team_a,
                tippsDesUsers[i].tore_team_b
            );
        }

        return answer;
    }


    async function gesPunkteBerechnen(tipper_ID)
    {
      answer = gesPunkteBerechnenZwischenErgebnis(tipper_ID);

      


      return answer;
    }



        async function spielRechts(w) {
        if (w && aktuellesSpiel != spiele.length - 1) {
            aktuellesSpiel += 1;
        } else if (!w && aktuellesSpiel != 0) {
            aktuellesSpiel -= 1;
        } else if (w && aktuellesSpiel == spiele.length - 1) {
            aktuellesSpiel = 0;
        } else {
            aktuellesSpiel = spiele.length - 1;
        }

        const suchtext = document.getElementById("suche").value.trim();
        if (suchtext === "") {
            await renderNormaleAnsicht();
        } else {
            await spielerSuchen();
        }
    }


    async function spielerSuchen() {
        const suchtext = document.getElementById("suche").value.trim().toLowerCase();

        const top5Body = document.getElementById("top5Body");
        const ichBody = document.getElementById("ichBody");
        const restBody = document.getElementById("restBody");

        top5Body.innerHTML = "";
        ichBody.innerHTML = "";
        restBody.innerHTML = "";

        if (suchtext === "") {
            await renderNormaleAnsicht();
            return;
        }

        document.getElementById("spielT").innerText =
            spiele[aktuellesSpiel].team_a + " - " + spiele[aktuellesSpiel].team_b +
            "\n" + spiele[aktuellesSpiel].tore_team_a + " : " + spiele[aktuellesSpiel].tore_team_b;

        const eigenerEintrag = rangliste.find(e => e.user_ID === currentUserId);

        if (eigenerEintrag) {
            await renderZeile(ichBody, eigenerEintrag, aktuellesSpiel, true);
        }

        const treffer = rangliste.filter(e =>
            e.user_ID !== currentUserId &&
            e.username.toLowerCase().includes(suchtext)
        );

        for (const eintrag of treffer) {
            await renderZeile(restBody, eintrag, aktuellesSpiel, false);
        }

    }

    // DOC 2: auto-set aktuellesSpiel to last finished game on init
    async function aktuellesSpiel_Laden() {
        for (let i = 0; i < spiele.length; i++) {
            if (spiele[i]["Spiel_fertig?"]) {
                aktuellesSpiel = i;
            }
        }
    }

    




    // Initialisierung
    await checkAuthAndInit();
    await aktuellesSpiel_Laden(); // DOC 2: added before spieleListeLaden
    await spieleListeLaden();
    await ranglisteEintragen();
    await renderNormaleAnsicht();

    // Event-Listener Gruppe 1 
    document.getElementById("tippSpeichern").addEventListener("click", speichern);
    document.getElementById("spiel_select").addEventListener("change", spielLaden);
    document.getElementById("btn_prev").addEventListener("click", () => spielWechseln(-1));
    document.getElementById("btn_next").addEventListener("click", () => spielWechseln(1));
   
    // Event-Listener Gruppe 3
    document.getElementById("suche").addEventListener("input", spielerSuchen);
    document.getElementById("refreshButton").addEventListener("click", ranglisteAktualisieren);
    document.getElementById("weiter").addEventListener("click", async function() {
        await spielRechts(true);
    });
    document.getElementById("zurueck").addEventListener("click", async function() {
        await spielRechts(false);
    });
    document.getElementById("punkte_info").addEventListener("click", (e) => {
        e.stopPropagation();
        e.currentTarget.classList.toggle("active");
    });
    
    // Allgemeine Event-Listener
    window.addEventListener("click", (e) => {
        const badge = document.getElementById("info_badge_tips");
        const badge2 = document.getElementById("punkte_info");

        if (badge && !e.target.closest("#info_badge_tips")) {
            badge.classList.remove("active");
        }

        if (badge2 && !e.target.closest("#punkte_info")) {
            badge2.classList.remove("active");
        }

        const err = document.getElementById("limit-error");
        if (err) err.classList.remove("active");
    });




  </script>
